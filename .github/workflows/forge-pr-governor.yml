name: Forge PR Governor

on:
  pull_request:
    types:
      - opened
      - synchronize
      - edited
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to evaluate
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: forge-pr-governor-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  governor:
    name: completion gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out governor script
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check governor
        run: node --check tools/forge-pr-governor.mjs

      - name: Run completion governor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node tools/forge-pr-governor.mjs
