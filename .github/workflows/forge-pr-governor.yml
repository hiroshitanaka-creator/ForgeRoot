name: Forge PR Governor

on:
  pull_request:
    types:
      - opened
      - synchronize
      - edited
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to evaluate
        required: true
        type: number

permissions:
  contents: read
  checks: write
  issues: read
  pull-requests: read

concurrency:
  group: forge-pr-governor-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  governor:
    name: completion gate
    runs-on: ubuntu-latest
    steps:
      - name: Run completion governor
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const max = {
              activeCodexThreads: 3,
              activeCodexP1: 0,
              activeCodexP2: 0,
              docsLineRatio: 0.4,
              docsFiles: 3,
              implementationFiles: 1,
            };
            const docOnlyLabels = new Set(['governor/docs-only-approved', 'docs-only-approved']);
            const manifestOnlyLabels = new Set(['governor/manifest-only-approved', 'manifest-only-approved']);
            const codexLogins = new Set(['chatgpt-codex-connector', 'github-copilot[bot]']);
            const { owner, repo } = context.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed('PR number is required.');
              return;
            }

            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: prNumber });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            async function listReviewThreads(number) {
              const query = `
                query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        nodes {
                          isResolved
                          isOutdated
                          path
                          comments(first: 20) {
                            nodes { author { login } body }
                          }
                        }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }`;
              const threads = [];
              let cursor = null;
              do {
                const data = await github.graphql(query, { owner, repo, number, cursor });
                const page = data.repository.pullRequest.reviewThreads;
                threads.push(...page.nodes);
                cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
              } while (cursor);
              return threads;
            }

            async function listOpenPulls() {
              const pulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              return pulls.map((item) => ({ number: item.number, title: item.title, headSha: item.head?.sha || null }));
            }

            const basename = (path) => path.split('/').pop() || path;
            const labels = new Set((issue.labels || []).map((label) => typeof label === 'string' ? label : label.name));
            const hasAnyLabel = (accepted) => [...labels].some((label) => accepted.has(label));
            const allowDocsOnly = hasAnyLabel(docOnlyLabels);
            const allowManifestOnly = hasAnyLabel(manifestOnlyLabels);
            const rootWorkspaceManifests = new Set(['package.json', 'package-lock.json', 'Cargo.toml', 'Cargo.lock']);
            const isGovernance = (path) => path.startsWith('.github/workflows/') ||
              path === '.github/pull_request_template.md' ||
              path.startsWith('.agents/skills/') ||
              path.startsWith('.forge/') ||
              path.startsWith('tools/') ||
              path.startsWith('scripts/');
            const isDoc = (path) => {
              if (isGovernance(path)) return false;
              const file = basename(path);
              return path.startsWith('docs/') || path.includes('/docs/') ||
                /^README(?: \(\d+\))?\.md$/i.test(file) ||
                file === 'TASK_PROGRESS.md' ||
                /(^|\/)(thread-handoff|validation-report|handoff)/i.test(path) ||
                /\.(md|mdx|rst|adoc|txt)$/i.test(file);
            };
            const isImplementation = (path) => {
              if (isGovernance(path)) return true;
              if (isDoc(path)) return false;
              if (rootWorkspaceManifests.has(path)) return true;
              const roots = ['apps/', 'crates/', 'packages/', 'schemas/'];
              return roots.some((root) => path.startsWith(root)) && /\.(ts|tsx|js|jsx|mjs|cjs|rs|py|sh|sql|json|toml|yaml|yml)$/i.test(path);
            };
            const body = pull.body || '';
            const isVerification = (path) => /(^|\/)(test|tests|__tests__)\//i.test(path) ||
              /\.(test|spec)\.(mjs|js|ts|tsx|rs)$/i.test(basename(path)) ||
              /validation[-_ ]output|test[-_ ]output|validation[-_ ]report/i.test(path);
            const hasSection = (name) => new RegExp(`(^|\\n)##\\s*${name}\\b`, 'i').test(body);
            const hasNonEmptyBulletField = (name) => new RegExp(`(^|\\n)\\s*-\\s*${name}:\\s*(?!\\s*(?:$|\\n))(?:\`[^\`\\n]+\`|[^\\n]*\\S)`, 'i').test(body);
            const bulletFieldValue = (name) => {
              const match = body.match(new RegExp(`(^|\\n)\\s*-\\s*${name}:\\s*([^\\n]+)`, 'i'));
              return match ? match[2].replace(/`/g, '').trim() : '';
            };
            const isPlaceholderVerificationValue = (value) => {
              const normalized = String(value || '').replace(/`/g, '').trim().toLowerCase();
              return normalized.length === 0 ||
                /^(?:not run|not-run|n\/a|na|none|todo|pending|skip|skipped|no command|no verification)$/i.test(normalized);
            };
            const isPassingVerificationResult = (value) => {
              const normalized = String(value || '').toLowerCase().trim();
              if (isPlaceholderVerificationValue(normalized)) return false;
              if (/\b0\s+(?:tests?|checks?|commands?|cases?)\s+(?:passed|passing|succeeded|successful|ok)\b/.test(normalized)) return false;
              if (/\b(?:[1-9][0-9]*\s+(?:fail|fails|failed|failure|failures)|(?:fail|fails|failed|failure|failures)\s*[:=]?\s*[1-9][0-9]*)\b/.test(normalized)) return false;
              const zeroFailures = /\b(?:0\s+(?:fail|fails|failed|failure|failures)|(?:fail|fails|failed|failure|failures)\s*[:=]?\s*0)\b/g;
              const hasZeroFailures = zeroFailures.test(normalized);
              zeroFailures.lastIndex = 0;
              const withoutZeroFailures = normalized.replace(zeroFailures, ' ');
              if (/\b(error|errored|not ok|no tests passed|not passed|cancelled|canceled|timed out|timeout|partial|failing|failed|failure|failures?)\b/.test(withoutZeroFailures)) return false;
              const ratio = normalized.match(/\b([0-9]+)\/([0-9]+)\s+(?:passing|passed)\b/);
              if (ratio) return Number(ratio[1]) > 0 && ratio[1] === ratio[2];
              return /^(passed|passing|ok|success|succeeded|yaml ok)\b/.test(normalized) ||
                /\b(all tests passed|tests passed)\b/.test(normalized) ||
                hasZeroFailures;
            };
            const verificationCommand = bulletFieldValue('Command');
            const hasVerificationCommand = hasNonEmptyBulletField('Command') && !isPlaceholderVerificationValue(verificationCommand);
            const verificationResult = bulletFieldValue('Result');
            const currentHeadCommit = bulletFieldValue('Current head commit');
            const hasVerificationResult = isPassingVerificationResult(verificationResult);
            const hasCurrentHeadCommit = currentHeadCommit === pull.head.sha;
            const hasTemplateBodyEvidence = (hasSection('Implementation evidence') || hasSection('Implementation') || hasSection('Code changes') || hasSection('Changed files')) &&
              (hasSection('Verification') || hasSection('Verification result') || hasSection('Test plan') || hasSection('Tests')) &&
              hasVerificationCommand &&
              hasVerificationResult &&
              hasCurrentHeadCommit &&
              !/(^|\n)\s*-\s*Result:\s*(?:not run|not-run|n\/a|none|todo|pending)\b/i.test(body);
            const isComposerGenerated = labels.has('forge:generated') && labels.has('forge:pr-composed');
            const hasComposerBodyEvidence = isComposerGenerated &&
              hasSection('ForgeRoot PR composition') &&
              /(^|\n)###\s*Audit gate\b/i.test(body) &&
              /(^|\n)\s*-\s*Audit result:\s*passed\b/i.test(body) &&
              /(^|\n)\s*-\s*Acceptance:\s*[1-9][0-9]*\/[1-9][0-9]*\s+passed,\s*0\s+failed\b/i.test(body) &&
              /(^|\n)###\s*Changed paths\b/i.test(body) &&
              /(^|\n)###\s*Sandbox evidence\b/i.test(body) &&
              hasCurrentHeadCommit &&
              /(^|\n)\s*-\s*Command IDs:\s*(?!none\b)[^\n]*\S/i.test(body);
            const hasBodyEvidence = hasTemplateBodyEvidence || hasComposerBodyEvidence;
            const manifestAnswerLine = body.split(/\r?\n/).find((line) => /Manifest-only or dry-run work\?/i.test(line)) || '';
            const manifestAnswer = manifestAnswerLine.replace(/^.*Manifest-only or dry-run work\?\s*/i, '').trim();
            const manifestAnswerDeclaresDocsOnly = /^docs[- ]only\b/i.test(manifestAnswer) &&
              !/^(no|false|n\/a|none)\b/i.test(manifestAnswer);
            const manifestAnswerDeclaresYes = /^(yes|true|manifest[- ]only|dry[- ]run|proposal[- ]only)\b/i.test(manifestAnswer) &&
              !manifestAnswerDeclaresDocsOnly &&
              !/^(no|false|n\/a|none)\b/i.test(manifestAnswer);
            const manifestAnswerDeclaresLabel = /\b(?:governor\/)?manifest-only-approved\b/i.test(manifestAnswer);
            const bodyWithoutManifestPrompt = body.split(/\r?\n/).filter((line) => !/Manifest-only or dry-run work\?/i.test(line)).join('\n');
            const manifestOnlyTerms = /\b(manifest[- ]only|dry[- ]run|proposal[- ]only)\b/i;
            const docsOnlyTerms = /\bdocs[- ]only\b/i;
            const declaresRestrictedWork = (line, terms) => {
              const value = String(line || '').trim();
              if (!terms.test(value)) return false;
              const termSource = terms.source;
              if (new RegExp(`\\b(?:not|no|never|without)\\b(?:\\W+\\w+){0,5}\\W+(?:${termSource})`, 'i').test(value) ||
                new RegExp(`\\bnon[- ]?(?:${termSource})`, 'i').test(value)) return false;
              return new RegExp(`^\\s*[-*]?\\s*(?:${termSource})\\s*$`, 'i').test(value) ||
                new RegExp(`\\b(this\\s+(pr|change|work)|the\\s+(pr|change|work)|scope|change|work|status)\\b.*\\b(is|are|was|remains|only|just)\\b.*(?:${termSource})\\b`, 'i').test(value) ||
                new RegExp(`(?:${termSource})\\s*(work|change|pr)?\\s*[:=-]?\\s*(yes|true)\\b`, 'i').test(value);
            };
            const bodyLinesForRestrictedWork = [pull.title || '', ...bodyWithoutManifestPrompt.split(/\r?\n/)];
            const hasManifestOnlyLanguage = manifestAnswerDeclaresYes ||
              manifestAnswerDeclaresLabel ||
              bodyLinesForRestrictedWork.some((line) => declaresRestrictedWork(line, manifestOnlyTerms));
            const hasDocsOnlyLanguage = manifestAnswerDeclaresDocsOnly ||
              bodyLinesForRestrictedWork.some((line) => declaresRestrictedWork(line, docsOnlyTerms));

            const changed = files;
            const docs = changed.filter((file) => isDoc(file.filename));
            const implementation = changed.filter((file) => isImplementation(file.filename));
            const verification = changed.filter((file) => isVerification(file.filename));
            const totalLines = files.reduce((sum, file) => sum + file.additions + file.deletions, 0);
            const docLines = docs.reduce((sum, file) => sum + file.additions + file.deletions, 0);
            const docRatio = totalLines > 0 ? docLines / totalLines : 0;

            const openPulls = await listOpenPulls();
            const threadGroups = await Promise.all(openPulls.map(async (pr) => ({ ...pr, threads: await listReviewThreads(pr.number) })));
            const severity = (body) => {
              const match = String(body || '').match(/(?:\[P([0-3])(?:\s+Badge)?\]|\bP([0-3])\b|badge\/P([0-3])(?:-|_|\?))/i);
              const priority = match?.[1] || match?.[2] || match?.[3];
              return priority ? `P${priority}` : 'unknown';
            };
            const codexThreads = threadGroups.flatMap((group) => group.threads.flatMap((thread) => {
              const comments = thread.comments.nodes.filter((comment) => codexLogins.has(comment.author?.login || '') || /Codex Review|Useful\? React with/i.test(comment.body || ''));
              if (!comments.length) return [];
              return [{ prNumber: group.number, active: !thread.isResolved && !thread.isOutdated, severities: comments.map((comment) => severity(comment.body || '')), path: thread.path }];
            }));
            const active = codexThreads.filter((thread) => thread.active);
            const activeP1 = active.filter((thread) => thread.severities.includes('P1') || thread.severities.includes('P0')).length;
            const activeP2 = active.filter((thread) => thread.severities.includes('P2')).length;
            const globalDebtFailures = [];
            if (activeP1 > max.activeCodexP1) globalDebtFailures.push(`Active Codex P1/P0 review threads: ${activeP1}. Must be zero.`);
            if (activeP2 > max.activeCodexP2) globalDebtFailures.push(`Active Codex P2 review threads: ${activeP2}. Must be zero.`);
            if (active.length > max.activeCodexThreads) globalDebtFailures.push(`Active Codex review threads: ${active.length}. Limit is ${max.activeCodexThreads}; collapse review debt before expanding scope.`);

            async function mirrorGlobalDebtToOpenPrChecks(groups, messages) {
              const isReviewDebtEvent = context.eventName === 'pull_request_review' || context.eventName === 'pull_request_review_comment';
              if (!isReviewDebtEvent || messages.length === 0) return 0;
              let mirrored = 0;
              for (const group of groups) {
                if (group.number === prNumber || typeof group.headSha !== 'string' || group.headSha.length === 0) continue;
                try {
                  await github.rest.checks.create({
                    owner,
                    repo,
                    name: 'completion gate',
                    head_sha: group.headSha,
                    status: 'completed',
                    conclusion: 'failure',
                    output: {
                      title: 'Forge PR Governor: global Codex review debt',
                      summary: [
                        `A review event on PR #${prNumber} changed repository-wide Codex review debt.`,
                        '',
                        ...messages.map((message) => `- ${message}`),
                      ].join('\n'),
                    },
                  });
                  mirrored += 1;
                } catch (error) {
                  core.warning(`Could not mirror global review-debt check to PR #${group.number}: ${error.message}`);
                }
              }
              return mirrored;
            }

            const failures = [];
            const fail = (message) => { failures.push(message); core.error(message); };
            const list = (items) => items.slice(0, 8).map((file) => `\`${file.filename || file}\``).join(', ') + (items.length > 8 ? `, +${items.length - 8} more` : '') || 'none';

            if (implementation.length < max.implementationFiles && !allowDocsOnly) fail('No implementation/governance artifact changed. Add executable code, automation, policy skill, tests, or an approved docs-only label.');
            if (docs.length > 0 && implementation.length === 0 && !allowDocsOnly) fail(`Docs-only drift is blocked. Docs changed: ${list(docs)}.`);
            if (docRatio > max.docsLineRatio && !allowDocsOnly) fail(`Docs ratio ${Math.round(docRatio * 100)}% exceeds ${Math.round(max.docsLineRatio * 100)}%. Keep docs subordinate to implementation.`);
            if (docs.length > max.docsFiles && !allowDocsOnly) fail(`Too many documentation files changed (${docs.length}). Limit is ${max.docsFiles} unless explicitly approved.`);
            if (implementation.length > 0 && verification.length === 0 && !hasBodyEvidence) fail('Implementation changed without test/verification evidence. Add tests, validation artifacts, or passing command results in the PR body.');
            if (hasManifestOnlyLanguage && !allowManifestOnly) fail('Manifest-only/dry-run/proposal-only work is blocked in completion mode unless explicitly approved by label.');
            if (hasDocsOnlyLanguage && !allowDocsOnly) fail('Docs-only work is blocked in completion mode unless explicitly approved by docs-only label.');
            if (!hasBodyEvidence) fail('PR body lacks Implementation evidence and Verification sections. Use the ForgeRoot PR template.');
            for (const message of globalDebtFailures) fail(message);
            const mirroredGlobalDebtChecks = await mirrorGlobalDebtToOpenPrChecks(threadGroups, globalDebtFailures);

            const summary = [
              '# Forge PR Governor',
              '',
              `- PR: #${prNumber} ${pull.title}`,
              `- Implementation/governance artifacts: ${implementation.length} (${list(implementation)})`,
              `- Documentation files: ${docs.length} (${list(docs)})`,
              `- Verification artifacts/evidence: ${verification.length}`,
              `- Docs line ratio: ${Math.round(docRatio * 100)}%`,
              `- Open PRs scanned for Codex review debt: ${threadGroups.length}`,
              `- Active Codex threads: ${active.length} / total ${codexThreads.length}`,
              `- Active Codex P1/P0: ${activeP1}`,
              `- Active Codex P2: ${activeP2}`,
              `- Mirrored global review-debt checks: ${mirroredGlobalDebtChecks}`,
              '',
              failures.length ? '## Failures' : '## Result',
              failures.length ? failures.map((item) => `- ${item}`).join('\n') : 'Governor passed.',
            ].join('\n');
            await core.summary.addRaw(summary).write();
            if (codexThreads.length >= 8) core.warning(`Codex review storm detected: ${codexThreads.length} total Codex threads.`);
            if (failures.length) core.setFailed(`${failures.length} completion-governor failure(s).`);
